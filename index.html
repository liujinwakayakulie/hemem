<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEMEM 展位</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #f0f9ff, #ecfeff);
        color: #0f172a;
      }
      .booth {
        max-width: 880px;
        margin: 6vh auto;
        padding: 32px;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin-top: 0;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }
      p {
        line-height: 1.7;
      }
      .tag {
        display: inline-block;
        margin-top: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-weight: 600;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main class="booth">
      <h1>HEMEM 展位</h1>
      <p class="tag">家用新能源汽车里程平衡模型</p>
      <p>
        欢迎来到 HEMEM（家用新能源汽车里程平衡模型）展位。该页面用于简洁展示项目名称与核心定位，适合在线演示、项目入口或线下展位大屏。
      </p>
    </main>
  </body>
</html>
